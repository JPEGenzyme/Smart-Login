<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/all.min.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/media.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Login</title>
</head>

<body class="container d-flex justify-content-center">

    <div class="shadow-lg my-5 py-5 px-5  text-center w-75 d-flex flex-column">
        <h1 class="d-block mb-3">Smart Login System</h1>
        <input type="email" class="form-control text-white rounded-1" placeholder="Enter your email" id="email">
        <input type="password" class="form-control text-white my-3 rounded-1 " placeholder="Enter your password" id="password">
        <h5 id="invalidd" class="d-none">invalid email or password</h5>
        <button class="btn w-100 mt-3">Login</button>
        <p class="mt-3 text-white">Don't have an account? <span><a href="../Signup/index.html" class="text-white text-decoration-none">Sign Up</a></span></p>
    </div>

    <script src="./js/bootstrap.bundle.min.js"></script>
    <script src="./js/main.js"></script>

</body>

</html>

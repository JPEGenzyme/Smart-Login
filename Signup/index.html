<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/all.min.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/media.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Signup</title>
</head>

<body class="container d-flex justify-content-center">

    <div class="shadow-lg my-5 py-5 px-5  text-center w-75 d-flex flex-column">
        <h1 class="d-block mb-3">Smart Login System</h1>
        <input id="name" type="text" class="form-control text-white rounded-1" placeholder="Enter your name" id="">
        <input id="email" type="email" class="form-control text-white my-3 rounded-1" placeholder="Enter your email" id="">
        <input id="password" type="password" class="form-control text-white mb-3 rounded-1 " placeholder="Enter your password" id="">
        <h5 id="success" class="d-none">Success</h5>
        <h5 id="invalid" class="d-none">invalid</h5>
        <h5 id="exists" class="d-none">Email already exists</h5>
        <button type="button" class="btn w-100 mt-3">Login</button>
        <p class="mt-3 text-white">Don't have an account? <span><a id="login" href="../Login/index.html" class="text-white text-decoration-none">Log In</a></span></p>
    </div>

    <script src="./js/bootstrap.bundle.min.js"></script>
    <script src="./js/main.js"></script>

</body>

</html>
